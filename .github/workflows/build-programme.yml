name: Build conference programme

on:
  push:
    branches:
      - main
    paths:
      - "programme.tex"
      - ".github/workflows/build-programme.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended

      - name: Compile programme
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error programme.tex
          pdflatex -interaction=nonstopmode -halt-on-error programme.tex

      - name: Prepare published files
        run: |
          mkdir -p public
          cp programme.pdf public/programme.pdf

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4